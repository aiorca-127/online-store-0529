<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Student Store</title>
    <style>
        /* CSS: This section styles our website to make it look clean and modern */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1.5rem 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Product Section Styles */
        .products {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            justify-content: center;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            width: 45%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        .product-card img {
            max-width: 100%;
            border-radius: 4px;
        }

        .price {
            font-size: 1.2rem;
            color: #27ae60;
            font-weight: bold;
        }

        /* Order Form Styles */
        .order-section {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't make inputs too wide */
        }

        button {
            background-color: #3498db;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        button:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Simple Store</h1>
        <p>Quality products for students</p>
    </header>

    <div class="container">
        <h2>Our Products</h2>
        <div class="products">
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1531346878377-a541e4a0ecce?w=400&q=80" alt="Classic Notebook">
                <h3>Classic Notebook</h3>
                <p>A high-quality 200-page lined notebook for all your class notes.</p>
                <p class="price">$12.00</p>
            </div>

            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1585336261022-680e295ce3fe?w=400&q=80" alt="Premium Pen Set">
                <h3>Premium Pen Set</h3>
                <p>Set of 3 smooth-writing gel pens. Perfect for exams.</p>
                <p class="price">$8.50</p>
            </div>
        </div>

        <div class="order-section">
            <h2>Place an Order</h2>
            
            <form action="https://formspree.io/f/YOUR_FORM_ID_HERE" method="POST">
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="product">Select Product:</label>
                    <select id="product" name="product" required>
                        <option value="">-- Please choose an option --</option>
                        <option value="Classic Notebook">Classic Notebook ($12.00)</option>
                        <option value="Premium Pen Set">Premium Pen Set ($8.50)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Quantity:</label>
                    <input type="number" id="quantity" name="quantity" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="message">Special Instructions or Message:</label>
                    <textarea id="message" name="message" rows="4"></textarea>
                </div>

                <button type="submit">Submit Order</button>
            </form>
        </div>
    </div>

</body>
</html>
