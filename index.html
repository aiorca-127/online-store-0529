<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orca's Store - Cute Dolls</title>
    <style>
        /* --- CSS: STYLING THE WEBSITE --- */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f8ff; /* Alice Blue background */
            color: #333;
        }

        header {
            background-color: #1a5276; /* Orca Blue */
            color: white;
            text-align: center;
            padding: 2rem 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Layout for Desktop: Products on left, Cart on right */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            max-width: 1100px;
            margin: 20px auto;
            padding: 0 20px;
            gap: 30px;
        }

        .products-section {
            flex: 2; /* Takes up more space */
            min-width: 300px;
        }

        .cart-section {
            flex: 1; /* Takes up less space */
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            align-self: flex-start; /* Keeps it at the top */
        }

        /* Product Cards */
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            width: calc(50% - 10px); /* 2 items per row */
            box-sizing: border-box;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            display: flex;
            flex-direction: column;
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.3rem;
            color: #e67e22; /* Warm orange for price */
            font-weight: bold;
            margin: 10px 0;
        }

        /* Buttons */
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover { background-color: #2980b9; }
        
        /* NEW: Style for the "Sold Out" disabled button */
        button:disabled {
            background-color: #95a5a6; /* Gray color */
            cursor: not-allowed;
        }
        button:disabled:hover {
            background-color: #95a5a6; /* Stays gray when hovering */
        }
        
        .remove-btn {
            background-color: #e74c3c;
            padding: 5px 10px;
            font-size: 0.8rem;
            margin-left: 10px;
        }
        .remove-btn:hover { background-color: #c0392b; }
        .remove-btn:disabled { display: none; /* Hide remove button if disabled */ }

        /* Cart Styling */
        #cart-items {
            list-style-type: none;
            padding: 0;
            margin-bottom: 20px;
        }

        #cart-items li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-total {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: right;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .checkout-btn { width: 100%; font-size: 1.1rem; padding: 15px; background-color: #2ecc71; }
        .checkout-btn:hover { background-color: #27ae60; }
        
        /* Hidden input for Formspree */
        #cart-data { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>Orca's Store</h1>
        <p>The softest, cutest plush dolls in town!</p>
    </header>

    <div class="main-container">
        
        <div class="products-section">
            <h2>Our Cuddly Friends</h2>
            <div class="products-grid">
                
                <div class="product-card">
                    <img src="https://mall.iopenmall.tw/website/uploads_product/website_8790/P0879013013748_4_140123669.jpeg?hash=66561" alt="Mimikyu doll *You can only buy one">
                    <h3>Mimikyu doll</h3>
                    <p>A super cute and furry doll. Perfect for hugging!</p>
                    <p class="price">$100</p>
                    <button id="btn-mimikyu" onclick="addToCart('Mimikyu doll', 100, 'btn-mimikyu')">Add to Cart</button>
                </div>

                <div class="product-card">
                    <img src="https://cf.shopee.tw/file/tw-11134207-81ztn-mglkb4gtzu329e" alt="Pokemon squishy **You can only buy one">
                    <h3>Pokemon squishy</h3>
                    <p>A squishy toy that reliefs you.</p>
                    <p class="price">$100</p>
                    <button id="btn-squishy" onclick="addToCart('Pokemon squishy', 100, 'btn-squishy')">Add to Cart</button>
                </div>

            </div>
        </div>

        <div class="cart-section">
            <h2>Your Cart 🛒</h2>
            
            <ul id="cart-items">
                <li style="color: #7f8c8d;">Your cart is empty.</li>
            </ul>
            
            <div class="cart-total" id="cart-total">
                Total: $0.00
            </div>

            <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

            <h3>Checkout Details</h3>
            
            <form action="https://formspree.io/f/xgoqqwkg" method="POST" id="order-form">
                
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="Customer Name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="Customer Email" required>
                </div>

                <div class="form-group">
                    <label for="address">Shipping Address:</label>
                    <textarea id="address" name="Shipping Address" rows="2" required></textarea>
                </div>

                <textarea id="cart-data" name="Order Details"></textarea>

                <button type="submit" class="checkout-btn">Place Order</button>
            </form>
        </div>

    </div>

    <script>
        // This array will hold the items the user clicks
        let shoppingCart = [];

        // Function 1: Add item to cart (NOW ACCEPTS BUTTON ID)
        function addToCart(itemName, itemPrice, buttonId) {
            // Check if the item is already in the cart
            let existingItem = shoppingCart.find(item => item.name === itemName);
            
            // If it is NOT in the cart, add it (enforces the "only buy one" rule)
            if (!existingItem) {
                // Notice we save the buttonId so we know which button belongs to this item
                shoppingCart.push({ name: itemName, price: itemPrice, quantity: 1, btnId: buttonId }); 
                
                // Change the button to "Sold Out" and make it gray/unclickable
                let btn = document.getElementById(buttonId);
                btn.innerText = "Sold Out";
                btn.disabled = true;
                
                updateCartDisplay();
            }
        }

        // Function 2: Remove item from cart
        function removeFromCart(itemName) {
            // First, find the item in the cart so we know which button to reset
            let itemToRemove = shoppingCart.find(item => item.name === itemName);
            
            if (itemToRemove) {
                // Reset the button back to "Add to Cart"
                let btn = document.getElementById(itemToRemove.btnId);
                btn.innerText = "Add to Cart";
                btn.disabled = false;
                
                // Remove it from the cart array
                shoppingCart = shoppingCart.filter(item => item.name !== itemName);
                updateCartDisplay();
            }
        }

        // Function 3: Update the screen and do the math
        function updateCartDisplay() {
            const cartList = document.getElementById('cart-items');
            const totalDisplay = document.getElementById('cart-total');
            const hiddenCartData = document.getElementById('cart-data');
            
            // Clear current list
            cartList.innerHTML = '';
            let grandTotal = 0;
            let textForEmail = "ORDER SUMMARY:\\n\\n"; // This goes to your email

            if (shoppingCart.length === 0) {
                cartList.innerHTML = '<li style="color: #7f8c8d;">Your cart is empty.</li>';
                totalDisplay.innerText = 'Total: $0.00';
                hiddenCartData.value = '';
                return;
            }

            // Loop through the cart and build the HTML and the Math
            shoppingCart.forEach(item => {
                let itemTotal = item.price * item.quantity;
                grandTotal += itemTotal;
                
                textForEmail += `- ${item.quantity}x ${item.name} ($${itemTotal.toFixed(2)})\\n`;

                let li = document.createElement('li');
                li.innerHTML = `
                    <span><b>${item.quantity}x</b> ${item.name}</span>
                    <span>
                        $${itemTotal.toFixed(2)} 
                        <button class="remove-btn" onclick="removeFromCart('${item.name}')">X</button>
                    </span>
                `;
                cartList.appendChild(li);
            });

            // Update Total Price on screen
            totalDisplay.innerText = `Total: $${grandTotal.toFixed(2)}`;
            
            // Update hidden form field so Formspree emails you the cart contents and total
            textForEmail += `\\nGRAND TOTAL: $${grandTotal.toFixed(2)}`;
            hiddenCartData.value = textForEmail;
        }

        // Make sure the form can't be submitted if the cart is empty
        document.getElementById('order-form').addEventListener('submit', function(event) {
            if (shoppingCart.length === 0) {
                event.preventDefault(); // Stop the form from sending
                alert("Your cart is empty! Please add some cute dolls first.");
            }
        });
    </script>

</body>
</html>
    </script>

</body>
</html>
